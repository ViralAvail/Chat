  <script type="text/babel" data-presets="react,env">
    const { useState, useEffect, useRef, useMemo } = React;

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorInfo: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errorInfo: error.toString() };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ padding: '20px', color: 'white', backgroundColor: '#e3342f', height: '100vh', width: '100vw', wordBreak: 'break-all', zIndex: 9999 }}>
              <h1 style={{fontSize: '24px', fontWeight:'bold', marginBottom:'10px'}}>App Crashed!</h1>
              <p>Take a screenshot of this error and show it to the developer:</p>
              <br/>
              <code style={{fontSize: '12px'}}>{this.state.errorInfo}</code>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const APP_ID = 'daksh-brahmgeet-ultimate-v2';

    const DRAW_COLORS = ['#ffffff', '#000000', '#ff3b30', '#ff9500', '#34c759', '#007aff', '#af52de'];
    const URL_REGEX = /(https?:\/\/[^\s]+)/g;

    const formatTime = (iso) => { try { return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } catch(e) { return ""; } };
    const isSameDay = (d1, d2) => { const a=new Date(d1),b=new Date(d2); return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); };
    const getDateLabel = (iso) => {
      const d = new Date(iso), t = new Date(), y = new Date(t); y.setDate(y.getDate()-1);
      if(isSameDay(d, t)) return "Today"; if(isSameDay(d, y)) return "Yesterday";
      return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    };

    const compressImage = (dataUrl) => new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const cvs = document.createElement('canvas');
        let { width, height } = img;
        if (width > height && width > 1200) { height *= 1200 / width; width = 1200; } 
        else if (height > 1200) { width *= 1200 / height; height = 1200; }
        cvs.width = width; cvs.height = height;
        cvs.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(cvs.toDataURL('image/jpeg', 0.6));
      };
      img.src = dataUrl;
    });

    const compressDp = (dataUrl) => new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const cvs = document.createElement('canvas');
        const size = 200; 
        cvs.width = size; cvs.height = size;
        const ctx = cvs.getContext('2d');
        const min = Math.min(img.width, img.height);
        const sx = (img.width - min) / 2;
        const sy = (img.height - min) / 2;
        ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
        resolve(cvs.toDataURL('image/jpeg', 0.5));
      };
      img.src = dataUrl;
    });

    const blobToBase64 = blob => new Promise(res => { const r = new FileReader(); r.onloadend = () => res(r.result); r.readAsDataURL(blob); });
    
    const formatTextWithLinks = (text) => {
      if (!text) return null;
      return text.split(URL_REGEX).map((part, i) => part.match(URL_REGEX) ? <a key={i} href={part} target="_blank" className="underline underline-offset-2 break-all decoration-white/30 hover:decoration-white transition-all" onClick={e => e.stopPropagation()}>{part}</a> : <span key={i}>{part}</span>);
    };

    const Avatar = ({ name, imgUrl, isOnline, size = "md", colorClass, onClick }) => {
      const sizes = { sm: "w-8 h-8 text-xs", md: "w-10 h-10 text-base", lg: "w-24 h-24 text-4xl" };

        <div onClick={onClick} className={`rounded-full flex items-center justify-center text-white font-semibold shadow-md relative shrink-0 ${colorClass} ${sizes[size]} ${onClick ? 'cursor-pointer' : ''} bg-cover bg-center`} style={imgUrl ? { backgroundImage: `url(${imgUrl})` } : {}}>
          {!imgUrl && (name ? name.charAt(0).toUpperCase() : "?")}
          {isOnline && size !== "lg" && <div className={`absolute bottom-0 right-0 rounded-full bg-green-500 border-2 border-ios-light dark:border-ios-dark ${size==='sm'?'w-2.5 h-2.5':'w-3 h-3'}`}></div>}

    };

    function App() {
      const [user, setUser] = useState(() => window.safeStorage.get('chat_user') || null);
      const [backendUser, setBackendUser] = useState(null); 
      const [messages, setMessages] = useState([]);
      const [events, setEvents] = useState([]);
      
      const [myDp, setMyDp] = useState(null);
      const [partnerDp, setPartnerDp] = useState(null);
      const [partnerStatus, setPartnerStatus] = useState({ online: false, lastActive: 0, typing: false });
      
      const [input, setInput] = useState("");
      const [replyingTo, setReplyingTo] = useState(null);
      const [editingMsg, setEditingMsg] = useState(null);
      const [activeMenu, setActiveMenu] = useState(null);
      const [pendingImages, setPendingImages] = useState([]);
      const [pendingDoc, setPendingDoc] = useState(null);
      const [showAttachmentMenu, setShowAttachmentMenu] = useState(false);
      
      const [activeModal, setActiveModal] = useState(null); 
      const [viewingImage, setViewingImage] = useState(null);
      
      const [profileTab, setProfileTab] = useState('media');
      const [toast, setToast] = useState(null);
      
      const [showEmojis, setShowEmojis] = useState(false);
      const [showGifs, setShowGifs] = useState(false);
      const [tenorGifs, setTenorGifs] = useState([]);
      const [gifSearch, setGifSearch] = useState("");
      const [isSearchingGifs, setIsSearchingGifs] = useState(false);
      
      const [isRecording, setIsRecording] = useState(false);
      const [recordTime, setRecordTime] = useState(0);

      const [drawColor, setDrawColor] = useState('#ffffff');
      const [drawSize, setDrawSize] = useState(5);
      const canvasRef = useRef(null);
      const isDrawingRef = useRef(false);

      const [newEventTitle, setNewEventTitle] = useState("");
      const [newEventDate, setNewEventDate] = useState("");

      const [isDark, setIsDark] = useState(() => { const s = window.safeStorage.get('chat_theme'); return s ? s === 'dark' : true; });
      const [chatColor, setChatColor] = useState(() => window.safeStorage.get('chat_color') || 'blue');
      
      const chatRef = useRef(null);
      const inputRef = useRef(null);
      const fileRef = useRef(null);
      const docRef = useRef(null);
      const camRef = useRef(null);
      const dpRef = useRef(null);
      
      const mediaRecorder = useRef(null);
      const audioChunks = useRef([]);
      const timerRef = useRef(null);
      const typingTimer = useRef(null);
      const toastTimer = useRef(null);

      const defaultPartner = user === 'Daksh' ? 'Brahmgeet' : 'Daksh';
      const partnerName = defaultPartner;
      const avatarColor = partnerName.toLowerCase().includes('brahm') ? 'bg-gradient-to-br from-pink-400 to-rose-500' : 'bg-gradient-to-br from-blue-400 to-indigo-500';
      const myAvatarColor = user === 'Brahmgeet' ? 'bg-gradient-to-br from-pink-400 to-rose-500' : 'bg-gradient-to-br from-blue-400 to-indigo-500';

      useEffect(() => {
        if (!window.Firebase) return;
        window.Firebase.signInAnonymously().catch(console.error);
        const unsub = window.Firebase.onAuthStateChanged(setBackendUser);
        return () => unsub();
      }, []);

      useEffect(() => {
        if (isDark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        window.safeStorage.set('chat_theme', isDark ? 'dark' : 'light');
        window.safeStorage.set('chat_color', chatColor);
      }, [isDark, chatColor]);

      useEffect(() => {
        if (!user || !backendUser) return;
        const { db, collection, doc, onSnapshot, setDoc, updateDoc } = window.Firebase;
        
        const msgsRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'messages');
        const unsubMsgs = onSnapshot(msgsRef, snap => {
          const rawMsgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          rawMsgs.forEach(m => { if (m.sender !== user && m.status !== 'read') updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'messages', m.id), { status: 'read' }).catch(()=>{}); });
          rawMsgs.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
          setMessages(rawMsgs);
          setTimeout(() => { if (chatRef.current) chatRef.current.scrollTo({ top: chatRef.current.scrollHeight }); }, 50);
        });

        const eventsRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'events');
        const unsubEvents = onSnapshot(eventsRef, snap => {
          const evts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          evts.sort((a, b) => new Date(a.date) - new Date(b.date));
          setEvents(evts);
        });

        const myRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'presence', user);
        const pRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'presence', defaultPartner);

        const unsubPresence = onSnapshot(pRef, d => { 
          if (d.exists()) {
            setPartnerStatus(d.data()); 
            if(d.data().dp) setPartnerDp(d.data().dp);
          } 
        });

        const unsubMyPresence = onSnapshot(myRef, d => {
          if (d.exists() && d.data().dp) setMyDp(d.data().dp);
        });

        const updateOnline = () => setDoc(myRef, { online: true, lastActive: Date.now() }, { merge: true }).catch(()=>{});
        updateOnline();
        const heartbeat = setInterval(updateOnline, 30000);
        
        const handleVis = () => document.visibilityState === 'hidden' ? setDoc(myRef, { online: false, lastActive: Date.now() }, { merge: true }) : updateOnline();
        document.addEventListener('visibilitychange', handleVis);

        return () => { unsubMsgs(); unsubEvents(); unsubPresence(); unsubMyPresence(); clearInterval(heartbeat); document.removeEventListener('visibilitychange', handleVis); };
      }, [user, backendUser]);

      useEffect(() => {
        if (!showGifs) return;
        const fetchGifs = async () => {
          setIsSearchingGifs(true);
          try {
            const q = gifSearch.trim() || 'trending';
            const res = await fetch(`https://g.tenor.com/v1/${q === 'trending' ? 'trending' : 'search?q='+q}&key=LIVDSRZULELA&limit=30`);
            const data = await res.json();
            if (data && data.results) {
              const urls = data.results.map(g => {
                if (g && g.media && g.media[0] && g.media[0].gif && g.media[0].gif.url) {
                  return g.media[0].gif.url;
                }
                return null;
              }).filter(Boolean);
              setTenorGifs(urls);
            }
          } catch (e) {
            console.error("GIF Error", e);
          } finally {
            setIsSearchingGifs(false);
          }
        };
        const t = setTimeout(fetchGifs, 400);
        return () => clearTimeout(t);
      }, [gifSearch, showGifs]);

      useEffect(() => {
        if(activeModal === 'draw' && canvasRef.current) {
          const cvs = canvasRef.current;
          cvs.width = cvs.offsetWidth;
          cvs.height = cvs.offsetHeight;
          const ctx = cvs.getContext('2d');
          ctx.fillStyle = '#1c1c1e';
          ctx.fillRect(0,0, cvs.width, cvs.height);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
        }
      }, [activeModal]);

      const mediaItems = useMemo(() => {
        const items = [];
        messages.forEach(m => {
          if (m.images) m.images.forEach(img => items.push({ url: img, id: m.id }));
          else if (m.image) items.push({ url: m.image, id: m.id });
        });
        return items.reverse();
      }, [messages]);

      const linkItems = useMemo(() => {
        const items = [];
        messages.forEach(m => {
          if (m.text) {
            const matches = m.text.match(URL_REGEX);
            if (matches) matches.forEach(url => items.push({ url, id: m.id, time: m.timestamp, sender: m.sender }));
          }
        });
        return items.reverse();
      }, [messages]);

      const docItems = useMemo(() => {
        const items = [];
        messages.forEach(m => {
          if (m.doc) items.push({ doc: m.doc, id: m.id, time: m.timestamp, sender: m.sender });

      const handleType = (e) => {

          window.Firebase.setDoc(ref, { typing: true, lastActive: Date.now() }, { merge: true });
          clearTimeout(typingTimer.current);
          typingTimer.current = setTimeout(() => window.Firebase.setDoc(ref, { typing: false }, { merge: true }), 2000);
        }
      };

      const startDraw = (e) => {
        if (!canvasRef.current) return;
        isDrawingRef.current = true;
        const ctx = canvasRef.current.getContext('2d');
        const rect = canvasRef.current.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0] && e.touches[0].clientY)) - rect.top;
        ctx.beginPath();
        ctx.moveTo(x, y);
      };
      
      const draw = (e) => {
        if(!isDrawingRef.current || !canvasRef.current) return;
        e.preventDefault(); 
        const ctx = canvasRef.current.getContext('2d');
        const rect = canvasRef.current.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0] && e.touches[0].clientY)) - rect.top;
        ctx.strokeStyle = drawColor;
        ctx.lineWidth = drawSize;
        ctx.lineTo(x, y);
        ctx.stroke();
      };
      
      const stopDraw = () => { isDrawingRef.current = false; };

      const handleImageUpload = async (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        setShowAttachmentMenu(false);
        const compressedImgs = await Promise.all(files.map(async file => {
           const dataUrl = await new Promise(resolve => { const r = new FileReader(); r.onloadend = () => resolve(r.result); r.readAsDataURL(file); });

                    </div>

                    <div className="bg-red-50 dark:bg-red-500/5 rounded-2xl border border-red-100 dark:border-red-500/10 overflow-hidden">
                      <button onClick={() => { if(confirm("Wipe all messages globally?")) { messages.forEach(m => window.Firebase.deleteDoc(window.Firebase.doc(window.Firebase.db, 'artifacts', APP_ID, 'public', 'data', 'messages', m.id))); closeCurrentModal(); } }} className="w-full flex items-center p-4 hover:bg-red-100 dark:hover:bg-red-500/20 text-red-600 transition-colors text-left border-b border-red-100 dark:border-red-500/10">
                        <div className="w-10 h-10 rounded-full bg-red-100 dark:bg-red-500/20 flex items-center justify-center mr-4"><i className="fa-solid fa-trash-can"></i></div>
                        <div><div className="font-bold">Clear Chat History</div><div className="text-xs opacity-80">Deletes for everyone forever</div></div>
                      </button>
                      <button onClick={() => { setUser(null); window.safeStorage.rem('chat_user'); closeCurrentModal(); }} className="w-full flex items-center p-4 hover:bg-red-100 dark:hover:bg-red-500/20 text-red-600 transition-colors text-left">
                        <div className="w-10 h-10 rounded-full bg-red-100 dark:bg-red-500/20 flex items-center justify-center mr-4"><i className="fa-solid fa-right-from-bracket"></i></div>
                        <div className="font-bold">Logout & Switch User</div>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          <header className="absolute top-0 w-full glass-header z-20 px-4 py-2.5 flex items-center justify-between shadow-sm">
            <div className="flex items-center gap-3 cursor-pointer group" onClick={() => openModal('profile')}>
              <Avatar name={partnerName} imgUrl={partnerDp} isOnline={partnerStatus.online && Date.now() - partnerStatus.lastActive < 60000} size="md" colorClass={avatarColor} />
              <div className="flex flex-col">
                <span className="font-semibold text-[17px] leading-tight group-hover:opacity-70 transition-opacity">{partnerName}</span>
                <span className={`text-[13px] leading-tight ${statusText === 'online' || statusText === 'typing...' ? 'text-blue-500' : 'text-gray-500'}`}>{statusText}</span>
              </div>
            </div>
            
            <div className="flex items-center gap-1">
              <button onClick={() => openModal('calendar')} className="w-12 h-12 rounded-full flex items-center justify-center text-gray-500 dark:text-gray-400 hover:bg-black/5 dark:hover:bg-white/10 transition-colors"><i className="fa-regular fa-calendar-days text-xl"></i></button>
              <button onClick={() => openModal('settings')} className="w-12 h-12 rounded-full flex items-center justify-center text-gray-500 dark:text-gray-400 hover:bg-black/5 dark:hover:bg-white/10 transition-colors p-3"><i className="fa-solid fa-ellipsis-vertical text-2xl"></i></button>
            </div>
          </header>

          <main ref={chatRef} className={`flex-1 overflow-y-auto px-4 pb-4 pt-[88px] custom-scrollbar relative z-10 bg-ios-light dark:bg-ios-dark`}>
            {grouped.map((item, i) => {
              if (item.type === 'date') return <div key={item.id} className="flex justify-center my-6"><span className="text-[12px] font-medium px-3 py-1 rounded-full bg-black/5 dark:bg-white/10 text-gray-500 dark:text-gray-400">{getDateLabel(item.val)}</span></div>;

              const msg = item;
              const isMe = msg.sender === user;
              const showMenu = activeMenu === msg.id;
              
              const prev = i > 0 && grouped[i-1].type === 'msg' ? grouped[i-1] : null;
              const next = i < grouped.length - 1 && grouped[i+1].type === 'msg' ? grouped[i+1] : null;
              const isFirst = !prev || prev.sender !== msg.sender || (new Date(msg.timestamp) - new Date(prev.timestamp) > 300000); 
              const isLast = !next || next.sender !== msg.sender || (new Date(next.timestamp) - new Date(msg.timestamp) > 300000);

              const bgClass = isMe ? `bg-${chatColor}-500 text-white` : 'bg-[#e9e9eb] dark:bg-[#262629] text-gray-900 dark:text-gray-100';
              
              let rounded = 'rounded-[20px]'; 
              if (isMe) { 
                if (!isFirst) rounded += ' rounded-tr-[5px]'; 
                if (!isLast) rounded += ' rounded-br-[5px]'; 
              } else { 
                if (!isFirst) rounded += ' rounded-tl-[5px]'; 
                if (!isLast) rounded += ' rounded-bl-[5px]'; 
              }

              return (
                <div key={msg.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'} ${isLast ? 'mb-3' : 'mb-[2px]'}`}>
                  <div className={`flex items-end gap-2 max-w-[85%] sm:max-w-[75%] relative group`}>
                    
                    <div className={`opacity-0 group-hover:opacity-100 transition-opacity flex items-center ${isMe ? 'order-1 pr-1' : 'order-2 pl-1'}`}>
                      <button onClick={(e) => { e.stopPropagation(); setActiveMenu(showMenu ? null : msg.id); }} className="w-6 h-6 rounded-full flex items-center justify-center text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors"><i className="fa-solid fa-ellipsis-vertical text-sm"></i></button>
                    </div>

                    {showMenu && (
                      <div className={`absolute ${isLast ? 'bottom-full mb-2' : 'top-0 mt-8'} ${isMe ? 'right-0' : 'left-0'} z-50 flex flex-col p-1.5 rounded-2xl shadow-xl bg-white dark:bg-[#1c1c1e] border border-gray-100 dark:border-white/10 w-56 animate-fade-in origin-${isMe?'bottom-right':'bottom-left'}`} onClick={e=>e.stopPropagation()}>
                        <div className="flex items-center justify-between p-2 bg-gray-50 dark:bg-black/50 rounded-xl mb-1.5">
                          {EMOJIS.quick.map(em => (<button key={em} onClick={() => handleReaction(msg.id, em, msg.reactions||[])} className="text-xl hover:scale-125 transition-transform origin-bottom">{em}</button>))}
                        </div>
                        <div className="flex flex-col">
                          <button onClick={() => { setReplyingTo(msg); setActiveMenu(null); }} className="w-full flex items-center gap-3 p-2.5 hover:bg-gray-50 dark:hover:bg-white/5 rounded-xl text-[15px] font-medium"><i className="fa-solid fa-reply text-gray-400 w-4"></i> Reply</button>
                          {msg.text && <button onClick={() => { navigator.clipboard.writeText(msg.text); setActiveMenu(null); }} className="w-full flex items-center gap-3 p-2.5 hover:bg-gray-50 dark:hover:bg-white/5 rounded-xl text-[15px] font-medium"><i className="fa-regular fa-copy text-gray-400 w-4"></i> Copy</button>}
                          {isMe && msg.text && !msg.image && (!msg.images || msg.images.length === 0) && !msg.audio && !msg.doc && <button onClick={() => { setEditingMsg(msg); setInput(msg.text); setActiveMenu(null); }} className="w-full flex items-center gap-3 p-2.5 hover:bg-gray-50 dark:hover:bg-white/5 rounded-xl text-[15px] font-medium"><i className="fa-solid fa-pen text-gray-400 w-4"></i> Edit</button>}
                          {isMe && <div className="h-px bg-gray-100 dark:bg-white/10 my-1"></div>}
                          {isMe && <button onClick={() => { window.Firebase.deleteDoc(window.Firebase.doc(window.Firebase.db, 'artifacts', APP_ID, 'public', 'data', 'messages', msg.id)); setActiveMenu(null); }} className="w-full flex items-center gap-3 p-2.5 hover:bg-red-50 dark:hover:bg-red-500/10 rounded-xl text-[15px] font-medium text-red-500"><i className="fa-solid fa-trash-can w-4"></i> Delete</button>}
                        </div>
                      </div>
                    )}

                    <div className={`flex flex-col relative ${bgClass} ${rounded} transition-all shadow-sm`} style={{ wordBreak: 'break-word' }} onDoubleClick={() => handleReaction(msg.id, '❤️', msg.reactions||[])}>
                      
                      <div className={`px-3.5 py-2 min-w-[70px] ${msg.image || (msg.images&&msg.images.length>0) ? 'p-1' : ''}`}>
                        
                        {msg.replyTo && (
                          <div className={`mb-2 pl-3 border-l-2 text-sm rounded-r-md py-1 px-2 ${isMe ? 'border-white bg-black/10' : 'border-[#0a84ff] bg-black/5 dark:bg-white/5'}`}>
                            <div className={`font-semibold text-[13px] mb-0.5 ${isMe ? 'text-white' : 'text-[#0a84ff]'}`}>{msg.replyTo.sender}</div>
                            <div className="line-clamp-2 text-[14px] opacity-90">{formatTextWithLinks(msg.replyTo.text)}</div>
                          </div>
                        )}

                        {msg.doc && (
                          <div className={`flex items-center gap-3 p-2 rounded-xl mb-1 ${isMe ? 'bg-black/10' : 'bg-white dark:bg-black/40'}`}>
                             <div className={`w-10 h-10 rounded-lg flex items-center justify-center text-2xl shrink-0 ${isMe ? 'bg-white text-current opacity-80' : 'bg-[#0a84ff] text-white'}`}><i className="fa-solid fa-file-lines"></i></div>
                             <div className="flex-1 min-w-0 pr-2">
                               <div className="font-semibold text-[15px] truncate leading-tight">{msg.doc.name}</div>
                               <div className="text-xs opacity-70 mt-0.5">{formatBytes(msg.doc.size)}</div>
                             </div>
                             <a href={msg.doc.data} download={msg.doc.name} className={`w-8 h-8 rounded-full flex items-center justify-center hover:opacity-70 transition-opacity ${isMe ? 'bg-white text-gray-900' : 'bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300'}`}><i className="fa-solid fa-arrow-down text-sm"></i></a>
                          </div>
                        )}

                        {(msg.image || (msg.images && msg.images.length > 0)) && (
                          <div className={`grid gap-[2px] rounded-[18px] overflow-hidden ${msg.text ? 'mb-1' : ''} ${(msg.images && msg.images.length >= 2) ? 'grid-cols-2' : 'grid-cols-1'}`}>
                             {(msg.images || [msg.image]).map((img, idx) => (
                               <div key={idx} className={`cursor-zoom-in relative group/img ${((msg.images && msg.images.length === 3) || (!msg.images && msg.image)) && idx === 0 ? 'col-span-full' : ''}`} onClick={() => openModal('image', img)}>
                                 <img src={img} className="w-full object-cover" style={{ aspectRatio: (msg.images && msg.images.length > 1) ? '1' : 'auto', maxHeight: (msg.images && msg.images.length > 1) ? 'auto' : '300px', minHeight: '120px' }} loading="lazy" />
                               </div>
                             ))}
                          </div>
                        )}

                        {msg.audio && (
                          <div className={`flex items-center gap-3 p-1 rounded-full ${msg.text ? 'mb-2' : ''} ${isMe ? 'bg-black/10' : 'bg-black/5 dark:bg-white/5'}`}>
                            <div className={`w-10 h-10 rounded-full flex items-center justify-center shrink-0 ${isMe ? 'bg-white text-current opacity-80' : 'bg-[#0a84ff] text-white'}`}><i className="fa-solid fa-play text-sm ml-0.5"></i></div>
                            <audio controls src={msg.audio} className="h-8 w-44 outline-none opacity-80" style={{ filter: isDark && !isMe ? 'invert(0.9) hue-rotate(180deg)' : (isMe ? 'invert(1) hue-rotate(180deg) brightness(1.5)' : 'none') }}></audio>
                          </div>
                        )}
                        
                        {msg.text && <div className={`leading-[1.35] whitespace-pre-wrap`}>{formatTextWithLinks(msg.text)}</div>}
                        
                        <div className={`text-[11px] flex justify-end items-center gap-1 font-medium select-none mt-1 ${isMe ? 'text-white/80' : 'text-gray-500'}`}>
                          {msg.isEdited && <span className="opacity-70 font-normal italic mr-1">edited</span>}
                          <span>{formatTime(msg.timestamp)}</span>
                          {isMe && (
                            <span className="flex items-center ml-0.5 relative w-3.5 h-3.5">
                              {msg.status === 'sent' && <i className="fa-solid fa-check text-[10px] opacity-70 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></i>}
                              {msg.status === 'delivered' && <i className="fa-solid fa-check-double text-[10px] opacity-90 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></i>}
                              {msg.status === 'read' && (
                                <svg className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[14px] h-[14px] drop-shadow-sm" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                  <path d="M2.5 12L7.5 17L18 6.5" stroke="#95e263" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>
                                  <path d="M7.5 12L12.5 17L23 6.5" stroke="#6dc235" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>
                                </svg>
                              )}
                            </span>
                          )}
                        </div>
                      </div>

                      {(msg.reactions && msg.reactions.length > 0) && (
                        <div className={`absolute -bottom-3 ${isMe ? 'right-2' : 'left-2'} bg-white dark:bg-[#1c1c1e] rounded-full px-2 py-0.5 shadow-sm border border-gray-100 dark:border-white/5 flex items-center gap-1.5 text-[13px] z-10`}>
                          {Array.from(new Set(msg.reactions)).map(emoji => {
                            const count = msg.reactions.filter(r => r === emoji).length;
                            return <span key={emoji} className="flex items-center gap-1">{emoji} {count > 1 && <span className="text-[10px] font-bold text-gray-500">{count}</span>}</span>
                          })}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}

            {partnerStatus.online && partnerStatus.typing && (
              <div className="flex items-start mb-4 animate-fade-in">
                <div className={`bg-[#e9e9eb] dark:bg-[#262629] rounded-[20px] rounded-bl-[5px] px-4 py-3 flex items-center gap-1`}>
                  <div className="w-1.5 h-1.5 bg-gray-500 rounded-full animate-bounce"></div>
                  <div className="w-1.5 h-1.5 bg-gray-500 rounded-full animate-bounce" style={{animationDelay: '0.15s'}}></div>
                  <div className="w-1.5 h-1.5 bg-gray-500 rounded-full animate-bounce" style={{animationDelay: '0.3s'}}></div>
                </div>
              </div>
            )}
            <div className="h-4"></div>
          </main>

          <footer className="glass-footer shrink-0 px-3 py-2.5 pb-safe z-30" onClick={e=>e.stopPropagation()}>
            
            {(editingMsg || replyingTo) && (
              <div className={`mb-2 px-3 py-2 bg-black/5 dark:bg-white/5 rounded-[18px] flex items-center justify-between animate-slide-up border-l-[3px] ${editingMsg ? 'border-green-500' : 'border-[#0a84ff]'}`}>
                <div className="flex flex-col truncate pr-4">
                  <span className={`text-[13px] font-semibold mb-0.5 ${editingMsg ? 'text-green-500' : 'text-[#0a84ff]'}`}>{editingMsg ? 'Edit Message' : `Replying to ${(replyingTo||{}).sender}`}</span>
                  <span className="text-[14px] text-gray-600 dark:text-gray-300 truncate">{(editingMsg||replyingTo||{}).text || 'Attachment'}</span>
                </div>
                <button onClick={() => { setEditingMsg(null); setReplyingTo(null); setInput(""); }} className="w-7 h-7 flex items-center justify-center bg-black/10 dark:bg-white/10 rounded-full text-gray-500"><i className="fa-solid fa-xmark text-sm"></i></button>
              </div>
            )}

            {pendingDoc && (
              <div className="mb-2 px-3 py-2 bg-black/5 dark:bg-white/5 rounded-[18px] flex items-center justify-between animate-slide-up">
                 <div className="flex items-center min-w-0 pr-2">
                   <div className="w-8 h-8 rounded-lg bg-[#0a84ff]/10 text-[#0a84ff] flex items-center justify-center text-lg mr-3"><i className="fa-solid fa-file"></i></div>
                   <div className="flex flex-col truncate">
                     <span className="text-[14px] font-semibold truncate text-gray-900 dark:text-white">{pendingDoc.name}</span>
                     <span className="text-[12px] text-gray-500">{formatBytes(pendingDoc.size)}</span>
                   </div>
                 </div>
                 <button onClick={() => setPendingDoc(null)} className="w-7 h-7 flex items-center justify-center bg-black/10 dark:bg-white/10 rounded-full text-gray-500"><i className="fa-solid fa-xmark text-sm"></i></button>
              </div>
            )}

            {pendingImages.length > 0 && (
              <div className="mb-2 p-2 bg-black/5 dark:bg-white/5 rounded-[18px] flex flex-wrap gap-2 overflow-y-auto max-h-32 custom-scrollbar animate-slide-up">
                {pendingImages.map((img, idx) => (
                  <div key={idx} className="relative w-16 h-16 group shrink-0">
                    <img src={img} className="w-full h-full object-cover rounded-xl border border-black/10 dark:border-white/10" />
                    <button type="button" onClick={() => setPendingImages(prev => prev.filter((_, i) => i !== idx))} className="absolute -top-1.5 -right-1.5 w-6 h-6 bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-white rounded-full flex items-center justify-center text-[10px] shadow-sm"><i className="fa-solid fa-xmark"></i></button>
                  </div>
                ))}
              </div>
            )}

            <div className="flex items-end gap-2">
              {!editingMsg && (
                <div className="relative mb-0.5">
                  <button type="button" onClick={() => setShowAttachmentMenu(!showAttachmentMenu)} className={`w-9 h-9 flex items-center justify-center rounded-full transition-all text-blue-500 hover:bg-black/5 dark:hover:bg-white/10`}><i className={`fa-solid fa-plus text-xl transition-transform ${showAttachmentMenu ? 'rotate-45' : ''}`}></i></button>
                  
                  {showAttachmentMenu && (
                    <div className="absolute bottom-full left-0 mb-3 flex flex-col gap-3 animate-slide-up z-50 bg-white dark:bg-[#1c1c1e] p-2.5 rounded-[24px] shadow-xl border border-gray-100 dark:border-white/5">
                      <button type="button" onClick={() => { setShowAttachmentMenu(false); camRef.current?.click(); }} className="flex flex-col items-center group"><div className="w-12 h-12 rounded-full bg-blue-500 text-white flex items-center justify-center text-xl mb-1 group-hover:scale-105 transition-transform"><i className="fa-solid fa-camera"></i></div><span className="text-[10px] font-semibold text-gray-500">Camera</span></button>
                      <button type="button" onClick={() => { setShowAttachmentMenu(false); fileRef.current?.click(); }} className="flex flex-col items-center group"><div className="w-12 h-12 rounded-full bg-purple-500 text-white flex items-center justify-center text-xl mb-1 group-hover:scale-105 transition-transform"><i className="fa-regular fa-image"></i></div><span className="text-[10px] font-semibold text-gray-500">Photo</span></button>
                      <button type="button" onClick={() => { setShowAttachmentMenu(false); docRef.current?.click(); }} className="flex flex-col items-center group"><div className="w-12 h-12 rounded-full bg-orange-500 text-white flex items-center justify-center text-xl mb-1 group-hover:scale-105 transition-transform"><i className="fa-solid fa-file-lines"></i></div><span className="text-[10px] font-semibold text-gray-500">Document</span></button>
                    </div>
                  )}
                </div>
              )}

              <div className={`flex-1 flex items-end rounded-[20px] transition-colors border ${isDark ? 'bg-[#1c1c1e] border-[#1c1c1e]' : 'bg-white border-gray-200'}`}>
                {isRecording ? (
                  <div className="flex-1 h-10 flex items-center justify-between px-4">
                    <div className="flex items-center gap-2">
                      <div className="relative flex items-center justify-center"><div className="w-2.5 h-2.5 bg-red-500 rounded-full relative z-10"></div><div className="w-2.5 h-2.5 bg-red-500 rounded-full absolute recording-pulse"></div></div>
                      <span className="text-red-500 font-bold font-mono tracking-wide text-sm">00:{recordTime < 10 ? `0${recordTime}` : recordTime}</span>
                    </div>
                    <button type="button" onClick={cancelVoice} className="text-[13px] font-medium text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">Cancel</button>
                  </div>
                ) : (
                  <>
                    <textarea ref={inputRef} value={input} onChange={handleType} placeholder={editingMsg ? "Edit message..." : "Message"} className="flex-1 bg-transparent border-none text-[16px] px-4 py-[9px] outline-none resize-none m-0 leading-snug text-gray-900 dark:text-gray-100 placeholder-gray-400 font-normal" style={{ height: '40px', minHeight: '40px', maxHeight: '140px' }} onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendPayload({}); } }} />
                    
                    <div className="flex items-center pb-1 pr-2 shrink-0 gap-1.5">
                      <button type="button" onClick={() => { setShowEmojis(!showEmojis); setShowGifs(false); setShowAttachmentMenu(false); }} className={`w-8 h-8 flex items-center justify-center rounded-full transition-colors text-gray-400 hover:text-blue-500 ${showEmojis ? 'bg-blue-500/10 text-blue-500' : ''}`}><i className="fa-regular fa-face-smile text-[19px]"></i></button>
                      
                      <button type="button" onClick={() => { setShowGifs(!showGifs); setShowEmojis(false); setShowAttachmentMenu(false); }} className={`w-8 h-8 flex items-center justify-center rounded-full transition-colors text-gray-400 hover:text-blue-500 ${showGifs ? 'bg-[#0a84ff]/10 text-[#0a84ff]' : ''}`}>
                         <div className="border-[2px] border-current rounded-[4px] px-[3px] text-[8px] font-black uppercase mt-0.5">GIF</div>
                      </button>
                      
                      {showEmojis && (
                        <div className="absolute bottom-14 right-10 shadow-2xl rounded-[24px] p-4 w-[280px] h-[300px] flex flex-col gap-2 z-[70] bg-white dark:bg-[#1c1c1e] border border-gray-100 dark:border-white/5 animate-slide-up">
                           <div className="grid grid-cols-5 gap-2 overflow-y-auto custom-scrollbar">
                              {EMOJIS.common.map((e, i) => <button key={i} type="button" onClick={() => handleType({target:{value: input + e}})} className="text-3xl p-1 hover:scale-125 transition-transform origin-bottom">{e}</button>)}
                           </div>
                        </div>
                      )}

                      {showGifs && (
                        <div className="absolute bottom-14 right-0 shadow-2xl rounded-[24px] p-2 w-[300px] h-[340px] flex flex-col gap-2 z-[70] bg-white dark:bg-[#1c1c1e] border border-gray-100 dark:border-white/5 animate-slide-up">
                          <div className="flex items-center gap-2 px-3 py-2 rounded-xl bg-gray-100 dark:bg-black/50">
                            <i className="fa-solid fa-magnifying-glass text-gray-400 text-sm"></i>
                            <input type="text" placeholder="Search GIFs..." value={gifSearch} onChange={(e) => setGifSearch(e.target.value)} className="bg-transparent border-none outline-none w-full text-sm font-medium text-gray-900 dark:text-white" />
                          </div>
                          <div className="flex-1 overflow-y-auto grid grid-cols-2 gap-1.5 custom-scrollbar pr-1">
                            {isSearchingGifs ? <div className="col-span-2 flex items-center justify-center text-gray-400"><i className="fa-solid fa-circle-notch animate-spin text-2xl"></i></div> : tenorGifs.map((url, i) => (<img key={i} src={url} onClick={() => sendPayload({ image: url })} className="rounded-lg h-24 w-full object-cover cursor-pointer hover:opacity-80" />))}
                          </div>
                        </div>
                      )}
                    </div>
                  </>
                )}
              </div>
              
              <div className="mb-0.5 shrink-0">
                {!hasContentToSend && !isRecording ? (
                  <button type="button" onClick={startVoice} className="w-9 h-9 flex items-center justify-center text-blue-500 hover:bg-black/5 dark:hover:bg-white/10 rounded-full transition-all"><i className="fa-solid fa-microphone text-lg"></i></button>
                ) : isRecording ? (
                  <button type="button" onClick={stopVoice} className="w-9 h-9 flex items-center justify-center bg-blue-500 text-white rounded-full transition-transform hover:scale-110"><i className="fa-solid fa-arrow-up text-sm"></i></button>
                ) : (
                  <button type="button" onClick={(e) => sendPayload({})} className={`w-9 h-9 flex items-center justify-center rounded-full transition-transform hover:scale-110 text-white ${editingMsg ? 'bg-green-500' : `bg-${chatColor}-500`}`}>
                    {editingMsg ? <i className="fa-solid fa-check"></i> : <i className="fa-solid fa-arrow-up text-sm"></i>}
                  </button>
                )}
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
