<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>V3 Premium — Direct Messages & Games</title>
  
  <!-- Dynamic SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='30' fill='%230a84ff'/><path d='M30 30h40a10 10 0 0 1 10 10v20a10 10 0 0 1-10 10H50L35 80v-10h-5a10 10 0 0 1-10-10V40a10 10 0 0 1 10-10z' fill='white'/><circle cx='40' cy='50' r='4' fill='%230a84ff'/><circle cx='50' cy='50' r='4' fill='%230a84ff'/><circle cx='60' cy='50' r='4' fill='%230a84ff'/></svg>">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { 
        extend: { 
          fontFamily: { 
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif']
          },
          colors: {
            ios: { light: '#f4f4f7', dark: '#090a0f', grayL: '#e9e9eb', grayD: '#1c1d24', blue: '#0a84ff' }
          },
          animation: { 
            'fade-in': 'fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards', 
            'slide-up': 'slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards', 
            'slide-right': 'slideRight 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'drawer-up': 'drawerUp 0.4s cubic-bezier(0.32, 0.72, 0, 1) forwards',
            'toast-drop': 'toastDrop 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'pop-in': 'popIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
            'pulse-glow': 'pulseGlow 2s infinite'
          }, 
          keyframes: { 
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } }, 
            slideUp: { '0%': { opacity: '0', transform: 'translateY(24px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }, 
            slideRight: { '0%': { transform: 'translateX(100%)' }, '100%': { transform: 'translateX(0)' } },
            drawerUp: { '0%': { transform: 'translateY(100%)' }, '100%': { transform: 'translateY(0)' } },
            toastDrop: { '0%': { opacity: '0', transform: 'translateY(-24px) scale(0.95)' }, '100%': { opacity: '1', transform: 'translateY(0) scale(1)' } },
            popIn: { '0%': { opacity: '0', transform: 'scale(0.85)' }, '100%': { opacity: '1', transform: 'scale(1)' } },
            pulseGlow: { '0%, 100%': { opacity: '0.6' }, '50%': { opacity: '1' } }
          } 
        } 
      }
    }
  </script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./css/styles.css">

  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

  <!-- FIREBASE 9.23.0 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="./js/sound-engine.js"></script>
  <script src="./js/firebase-config.js"></script>
  <script src="./js/games.js"></script>
</head>
<body class="text-gray-900 dark:text-gray-100 overflow-hidden font-sans antialiased selection:bg-blue-500/30 bg-[#edf0f5] dark:bg-[#06070a]">
  
  <!-- DIAGNOSTIC ERROR LOGGER -->
  <div id="error-log" style="color: white; background: #e3342f; z-index: 99999; position: absolute; top:0; left:0; width: 100%; display: none; padding: 16px; font-family: monospace; font-size: 12px; font-weight: bold;"></div>
  <script>
    window.onerror = function(msg, url, line) {
      document.getElementById('error-log').style.display = 'block';
      document.getElementById('error-log').innerHTML += 'CRASH: ' + msg + ' (Line: ' + line + ')<br>';
      return false;
    };
    window.addEventListener('unhandledrejection', function(event) {
      document.getElementById('error-log').style.display = 'block';
      document.getElementById('error-log').innerHTML += 'PROMISE CRASH: ' + (event.reason ? event.reason.message || event.reason : 'Unknown') + '<br>';
    });
  </script>

  <div id="root"></div>

  <script type="text/babel" data-presets="react,env" src="./js/app.js"></script>
</body>
</html>
